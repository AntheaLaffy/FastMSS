[workspace]
resolver = "3"
members = [
    "crates/mss-core",
    "crates/mss-audio",
    "crates/mss-kernels",
    "crates/mss-models",
    "crates/mss-runtime",
    "crates/mss-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mss-core = { path = "crates/mss-core" }
mss-audio = { path = "crates/mss-audio" }
mss-kernels = { path = "crates/mss-kernels" }
mss-models = { path = "crates/mss-models" }
mss-runtime = { path = "crates/mss-runtime" }
